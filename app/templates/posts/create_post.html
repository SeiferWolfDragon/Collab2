{% extends 'base.html' %}

{% block title %} Crear Nuevo Post {% endblock %}

{% block content %}
<div class="columns">
    <div class="column is-offset-3 is-6">
        <div class="card">
            <div class="card-content">
                <div class="media">
                    <div class="media-content">
                        <p class="title is-4">Agregar Post</p>
                    </div>
                </div>
                <div class="content">
                    <form action="{{ url_for('posts.add_post') }}" method="post">
                        <div class="field">
                            <label class="label" for="title">Titulo:</label>
                            <div class="control">
                                <input class="input" type="text" id="title" name="title" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label" for="category">Categoria:</label>
                            <div class="control">
                                <div class="select">
                                    <select id="category" name="category_id" required>
                                        <option value="" disabled selected>Selecciona una categoría</option>
                                        {% for category in categories %}
                                            <option value="{{ category.id }}">{{ category.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label" for="content">Contenido:</label>
                            <div class="control">
                                <textarea class="textarea" id="content" name="content" required></textarea>
                            </div>
                        </div>

                        <div class="buttons">
                            <button class="button is-success" type="submit">Agregar</button>
                            <a class="button is-danger" href="{{ url_for('index') }}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
