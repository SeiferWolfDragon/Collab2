<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Categorías</title>
</head>
<body>
    <h1>Listar Categorías</h1>
    <a href="{{ url_for('new_category') }}">Crear Nueva Categoría</a>
    <ul>
        {% for category in categories %}
            <li>
                {{ category.name }}
                <a href="{{ url_for('edit_category', id=category.id) }}">Editar</a>
                <form action="{{ url_for('delete_category', id=category.id) }}" method="post" style="display:inline;">
                    <button type="submit">Eliminar</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
